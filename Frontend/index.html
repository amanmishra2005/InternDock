<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>InternDock — Premier Tech Internship & Upskilling Platform</title>
    <meta name="application-name" content="InternDock" />
    <meta name="description" content="InternDock is India's premier tech internship platform for students and graduates. Apply for Full Stack, ML, Cloud, Cybersecurity & 25+ domain tracks. Get an instant Offer Letter, mentor code reviews, weekly capstone projects, and a cryptographically verified Completion Certificate — starting at just ₹100." />
    <meta name="keywords" content="InternDock, tech internship India, online internship with certificate, offer letter internship, full stack internship, machine learning internship, cloud computing internship, verified internship certificate, internship for students, winter internship 2026 2027, capstone project internship" />
    <meta name="author" content="InternDock" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="canonical" href="https://interndock.in/" />

    <!-- Icons & Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.png" type="image/png" />

    <!-- Open Graph (Facebook / LinkedIn / WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://interndock.in/" />
    <meta property="og:site_name" content="InternDock" />
    <meta property="og:title" content="InternDock — Apply for Tech Internships & Get Verified Credentials" />
    <meta property="og:description" content="India's premier tech internship platform. Choose from 25+ domain tracks — Full Stack, ML, Cloud, Cybersecurity & more. Get a verified Offer Letter instantly. Starting ₹100." />
    <meta property="og:image" content="https://interndock.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="InternDock — Premier Tech Internship Platform" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@interndock" />
    <meta name="twitter:title" content="InternDock — Tech Internships with Verified Offer Letters & Certificates" />
    <meta name="twitter:description" content="Apply for real-world tech internships in Full Stack, ML, Cloud & 25+ tracks. Instant Offer Letter. Weekly capstone projects. Verified credentials." />
    <meta name="twitter:image" content="https://interndock.in/og-image.png" />

    <!-- Google Fonts & Resource Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "InternDock",
      "alternateName": ["InternDock Tech Talent Platform", "InternDock Internship Platform"],
      "url": "https://interndock.in",
      "logo": {
        "@type": "ImageObject",
        "url": "https://interndock.in/logo.png",
        "width": 512,
        "height": 512
      },
      "image": "https://interndock.in/og-image.png",
      "description": "InternDock is India's premier tech internship platform. We offer 25+ domain tracks including Full Stack Development, Machine Learning, Cloud Computing and Cybersecurity with real capstone projects, mentor feedback, instant Offer Letters and cryptographically verified Completion Certificates.",
      "foundingDate": "2024",
      "areaServed": "IN",
      "serviceType": "Technology Internship Platform",
      "sameAs": [
        "https://github.com/interndock",
        "https://linkedin.com/company/interndock",
        "https://twitter.com/interndock"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Support",
        "email": "support.interndock@gmail.com",
        "availableLanguage": "English"
      }
    }
    </script>

    <!-- Structured Data: WebSite (controls site name shown in Google Search) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "InternDock",
      "alternateName": "InternDock — Tech Internship Platform",
      "url": "https://interndock.in",
      "description": "India's premier tech internship platform with verified offer letters, capstone projects, and completion certificates across 25+ technology domains.",
      "inLanguage": "en-IN",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://interndock.in/domains?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data: EducationalOrganization (boosts edu-related search rankings) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "InternDock",
      "url": "https://interndock.in",
      "logo": "https://interndock.in/logo.png",
      "description": "InternDock provides structured technology internship programs for students and graduates across 25+ domains including Full Stack Web Development, Machine Learning & AI, Cloud Computing, Cybersecurity, Data Science, UI/UX Design and more.",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Tech Internship Tracks",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Course",
              "name": "Full Stack Web Development Internship",
              "description": "Build production-grade full stack web applications with React, Node.js, MongoDB. Includes weekly capstone milestones and mentor code reviews.",
              "provider": { "@type": "Organization", "name": "InternDock" }
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Course",
              "name": "Machine Learning & AI Internship",
              "description": "Hands-on ML internship covering supervised learning, NLP, LLMs, LangChain and production AI pipelines with real capstone projects.",
              "provider": { "@type": "Organization", "name": "InternDock" }
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Course",
              "name": "Cloud Computing & DevOps Internship",
              "description": "Master AWS, Docker, Kubernetes, CI/CD pipelines and cloud architecture with real-world deployment projects.",
              "provider": { "@type": "Organization", "name": "InternDock" }
            }
          }
        ]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
