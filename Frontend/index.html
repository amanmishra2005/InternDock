<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InternDock — Premier Tech Internship & Upskilling Platform</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="InternDock is the premier technology internship platform. Master full-stack development, machine learning, cloud computing & cybersecurity with verified capstone projects and instant credential validation." />
    <meta name="keywords" content="InternDock, internships, MERN stack, full stack development, machine learning, data science, tech internships, verified certificate, offer letter" />
    <meta name="author" content="InternDock" />
    <meta name="robots" content="index, follow" />

    <!-- Icons & Favicon for Browsers & Google Search Console -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.png" type="image/png" />

    <!-- Open Graph / Facebook / LinkedIn Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://interndock.com/" />
    <meta property="og:site_name" content="InternDock" />
    <meta property="og:title" content="InternDock — Launch Your Tech Career" />
    <meta property="og:description" content="Gain industry-ready experience with hands-on internships, mentor-graded assignments, and cryptographically verified certificates." />
    <meta property="og:image" content="https://interndock.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InternDock — Tech Internships & Verified Credentials" />
    <meta name="twitter:description" content="Build real software projects, receive offer letters, and earn verified industry certificates." />
    <meta name="twitter:image" content="https://interndock.com/og-image.png" />

    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Google Search Console Structured Data (JSON-LD Organization & Website Schema) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "InternDock",
      "alternateName": "InternDock Tech Talent Platform",
      "url": "https://interndock.com",
      "logo": "https://interndock.com/logo.png",
      "image": "https://interndock.com/og-image.png",
      "description": "InternDock is a full-stack internship & talent platform offering real-world domain training, capstone project evaluation, and verified offer letters and completion certificates.",
      "sameAs": [
        "https://github.com/interndock",
        "https://linkedin.com/company/interndock",
        "https://twitter.com/interndock"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Support",
        "email": "support@interndock.com"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "InternDock",
      "url": "https://interndock.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://interndock.com/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
